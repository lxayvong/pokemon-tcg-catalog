name: Refresh TCGplayer sealed market prices
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tcg-market-prices.yml"
      - "scripts/update_tcgplayer_markets.py"
      - "tests/test_tcg_market_dates.py"
  workflow_dispatch:
    inputs:
      market_date:
        description: "Optional exact TCGCSV snapshot date (YYYY-MM-DD); blank uses upstream published date"
        required: false
        type: string
  schedule:
    # Poll for new upstream dates; script harmlessly skips unchanged builds.
    - cron: "35 21 * * *"
permissions:
  contents: write
concurrency:
  group: tcg-market-price-sync
  cancel-in-progress: false
jobs:
  update-market-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate upstream date and no-duplicate logic
        run: python -m unittest discover -s tests -p 'test_tcg_market_dates.py' -v
      - name: Pull exact TCGplayer Market Price records
        run: |
          EXPECTED="${{ github.event.inputs.market_date }}"
          if [ -n "$EXPECTED" ]; then
            # A manually specified snapshot date must match TCGCSV exactly.
            python scripts/update_tcgplayer_markets.py --date "$EXPECTED"
          else
            # Scheduled runs use the upstream's actual published snapshot date.
            python scripts/update_tcgplayer_markets.py
          fi
      - name: Commit actual verified price results
        run: |
          if git diff --quiet -- shared/tcgplayer-market-daily.js shared/tcgplayer-market-audit.json shared/catalog-price-map.json; then
            echo "No updated prices returned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/tcgplayer-market-daily.js shared/tcgplayer-market-audit.json shared/catalog-price-map.json
          git commit -m "Refresh exact sealed market prices and confirmed TCGplayer product ID mapping"
          git push
